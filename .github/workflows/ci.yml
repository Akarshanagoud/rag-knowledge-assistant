name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=ragkit --cov-report=term-missing

  no-numpy:
    # numpy is an accelerator, not a requirement. The pure-Python path must
    # produce the same answers, so the suite runs without it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" && pip uninstall -y numpy
      - run: pytest -q

  quality-gates:
    # The README publishes retrieval and answering numbers. These gates make
    # them regression tests rather than marketing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[fast]"
      - name: Retrieval and answer quality
        run: ragkit eval --min-recall 0.95 --min-abstention 1.0 --min-grounded 1.0
      - name: Configuration comparison still runs
        run: ragkit compare --chunkers --sizes --retrieval-only
      - name: A question outside the corpus is declined
        run: |
          set -e
          ragkit ask "How do I configure the Kubernetes ingress controller?" > out.txt
          grep -q "abstained" out.txt

  vector-stores:
    # FAISS and Chroma are optional; when installed they must pass the same
    # retrieval evaluation as the exact in-memory baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[faiss,chroma]"
      - run: ragkit eval --store faiss --min-recall 0.90
      - run: ragkit eval --store chroma --min-recall 0.90
      - run: ragkit compare --stores --retrieval-only
