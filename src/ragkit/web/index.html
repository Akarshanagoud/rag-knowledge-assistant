<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fbf'/%3E%3Cpath d='M9 9h10a4 4 0 014 4v10H13a4 4 0 01-4-4z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="kit.css">
  <style>
    :root { --accent: #1f5fbf; --accent-text: #1f5fbf; --accent-wash: rgba(31, 95, 191, 0.1); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) { --accent-text: #86b6ef; --accent-wash: rgba(134, 182, 239, 0.16); }
    }
    :root[data-theme="dark"] { --accent-text: #86b6ef; --accent-wash: rgba(134, 182, 239, 0.16); }
    .ask-bar { display: flex; gap: 8px; }
    .ask-bar .input { height: 42px; font-size: 15px; }
    .ask-bar .btn { height: 42px; padding: 0 18px; }
    .turn { border-top: 1px solid var(--border); padding: 16px 18px; cursor: pointer; }
    .turn:first-child { border-top: 0; }
    .turn.selected { background: var(--accent-wash); }
    .turn-q { font-weight: 600; margin-bottom: 6px; }
    .answer { line-height: 1.65; }
    .marker {
      display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
      margin: 0 2px; border-radius: 4px; background: var(--accent-wash); color: var(--accent-text); font-size: 11px;
      font-weight: 700; vertical-align: 1px; cursor: pointer; border: 0; font-family: var(--font);
    }
    .marker:hover, .marker.is-active { background: var(--accent); color: var(--accent-ink); }
    .evidence { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
    .evidence.is-active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
    .evidence .chunk-text { font-size: 13px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; margin-top: 8px; max-height: 180px; overflow: auto; }
    .score-row { display: grid; grid-template-columns: 64px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
    .doc-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
    .doc-chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .mode-col { min-width: 0; }
    .rank-item { border-top: 1px solid var(--border); padding: 10px 0; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
    .rank-item:first-child { border-top: 0; }
    .rank-n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
    .rank-item.relevant .rank-n { background: var(--good-wash); color: var(--good-text); }
    .chunk-seg { border-radius: 3px; }
    .chunk-seg.odd { background: var(--accent-wash); }
    .chunk-seg.is-active { outline: 2px solid var(--focus); }
    .tag { font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 0 6px; margin-right: 4px; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/ask"><span class="brand-mark" aria-hidden="true">KA</span><span class="brand-name">Knowledge Assistant</span><span class="brand-sub">ragkit</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <span class="env-pill" id="env">connecting</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main class="page" id="app"></main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
