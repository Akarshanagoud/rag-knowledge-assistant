[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "A production-shaped RAG stack with a retrieval and answer evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "bm25", "hybrid-search", "vector-database", "faiss", "chroma", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]
faiss = ["faiss-cpu>=1.7", "numpy>=1.24"]
chroma = ["chromadb>=0.5"]
models = ["sentence-transformers>=3.0"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "numpy>=1.24", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
ragkit = "ragkit.cli:main"

[project.urls]
Homepage = "https://github.com/Akarshanagoud/rag-knowledge-assistant"
Issues = "https://github.com/Akarshanagoud/rag-knowledge-assistant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragkit = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["ragkit"]
branch = true
